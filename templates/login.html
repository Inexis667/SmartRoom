{% extends "base.html" %}

{% block content %}
<div style="max-width: 400px; margin: 50px auto;">
    <div class="card">
        <h2 style="text-align: center; margin-bottom: 20px;">Вход для администратора</h2>
        <form method="POST" action="/login" style="display: flex; flex-direction: column; gap: 15px;">
            <input type="text" name="username" placeholder="Логин" required style="padding: 10px; border-radius: 8px; border: 1px solid #ccc;">
            <input type="password" name="password" placeholder="Пароль" required style="padding: 10px; border-radius: 8px; border: 1px solid #ccc;">
            <button type="submit" class="btn-primary" style="width: 100%;">Войти</button>
        </form>
        {% if not is_readonly %}
        <div style="text-align: center; margin-top: 15px;">
            <a href="/logout" style="color: #ef4444;">Выйти</a>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
