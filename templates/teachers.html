{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h2>Преподаватели</h2>
</div>

<div class="card">
    <h3>Добавить преподавателя</h3>
    <form action="/teachers/add" method="POST" class="inline-form">
        <input type="text" name="full_name" placeholder="ФИО (напр. Иванов И. И.)" required style="flex: 1;">
        <button type="submit" class="btn-primary">Добавить</button>
    </form>
</div>

<div class="card mt-20">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3>Список преподавателей</h3>
        <form method="GET" action="/teachers" style="display: flex; gap: 10px;">
            <input type="text" name="search" value="{{ search }}" placeholder="Поиск по ФИО..." style="padding: 8px; border-radius: 6px; border: 1px solid var(--border);">
            <button type="submit" class="btn-primary">Найти</button>
        </form>
    </div>

    <table class="data-table">
        <thead>
            <tr>
                <th>№</th>
                <th>ФИО</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody>
            {% for teacher in teachers %}
            <tr>
                <td>{{ loop.index }}</td>
                <td><strong>{{ teacher.full_name }}</strong></td>
                <td>
                    <form action="/teachers/delete/{{ teacher.id }}" method="POST" class="inline-action">
                        <button type="submit" class="btn-icon text-red" title="Удалить"><i class="fa-solid fa-trash"></i></button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3" class="text-center">Преподавателей не найдено.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
